<body>

  <nav class="navbar navbar-expand-sm bg-dark bg-gradient p-3">
    <div class="container-fluid" id="navbar">
      <a href="#" class="navbar-brand"><img src="./images/brandlogo.png" alt="" style="width: 50px;"></a>
      <button class="navbar-toggler border-3 border-white" type="button" data-bs-toggle="collapse" data-bs-target="#navigation" aria-expanded="false">
        <i class="fa-solid fa-bars text-white fs-2"></i>
      </button>
      <div class="collapse navbar-collapse" id="navigation">
        <ul class="navbar-nav d-flex">
          <li class="nav-item">
            <a href="./" class="nav-link py-1 px-3 rounded-1 text-white">Home</a>
          </li>
          <li class="nav-item">
            <a href="./portfolio" class="nav-link py-1 px-3 rounded-1 text-white">Portfolio</a>
          </li>
          <li class="nav-item">
            <a href="./pricing" class="nav-link py-1 px-3 rounded-1 text-white">Pricing</a>

          <li class="nav-item">
            <a href="./contact-me" class="nav-link py-1 px-3 rounded-1 text-white">Contact Me</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

    <div class="container-fluid d-flex my-3 justify-content-center">
        <h1 class="text-white">Contact Me</h1>
    </div>

    <div class="container-fluid vh-100">
      
      <div class="container-fluid d-flex w-fit-content justify-content-center bg-purple rounded-5 p-3 text">
        
      <form class="p-4 border-2" action="https://formsubmit.co/info@krakenthekode.com">
        <input type="text" name="_honey" style="display:none">
        <input type="hidden" name="_subject" value="New Inquiry">

          <div class="container-fluid d-flex flex-column">
            <input type="email" name="Sender&nbsp;Email" placeholder="Email" class="p-1 mb-3 bg-transparent">
            <input type="text" name="Plan" placeholder="Desired Plan" class="p-1 mb-3 bg-transparent">
            <input type="text" name="Page&nbsp;amount" placeholder="Number of Pages" class="p-1 mb-3 bg-transparent">
            <input type="text" name="Domain&nbsp;needed" placeholder="Do you need a domain?" class="p-1 mb-3 bg-transparent">
            <textarea name="Additional&nbsp;info" rows="5" placeholder="Additional Info" class="p-1 mb-3 bg-transparent"></textarea>
            <input type="button" class="btn btn-light fw-bold" value="Send Message">
          </div>
        


      </form>
      </div>
      </div>
    </div>
    
    <footer class="p-3 bg-dark bg-gradient">
        <p class="text-center text-white footer-text">© <span id="year"></span> Kraken The Kode</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
