<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken The Kode - Request a Quote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Add jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="./">
                <img src="./images/brandlogo.png" alt="Kraken The Kode" width="50">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list text-white fs-2"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="./">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./portfolio">Portfolio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./request-quote">Request a Quote</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Background Image -->
    <div class="container-fluid" id="fixed"></div>

    <!-- Quote Request Section -->
    <section class="quote-request py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <h1 class="text-center mb-5">Request Your Quote</h1>
                    <div class="quote-form">
                        <form action="https://formsubmit.co/ametheriustwitch@gmail.com" method="POST">
                            <!-- Honeypot to prevent spam -->
                            <input type="text" name="_honey" style="display:none">
                            
                            <!-- Disable Captcha -->
                            <input type="hidden" name="_captcha" value="false">
                            
                            <!-- Specify redirect after submission -->
                            <input type="hidden" name="_next" value="https://krakenthekode.com/thank-you">
                            
                            <!-- Custom subject -->
                            <input type="hidden" name="_subject" value="New Quote Request">

                            <div class="mb-4">
                                <label for="name" class="form-label">Name*</label>
                                <input type="text" id="name" name="name" class="form-control" required>
                            </div>

                            <div class="mb-4">
                                <label for="email" class="form-label">Email Address*</label>
                                <input type="email" id="email" name="email" class="form-control" required>
                            </div>

                            <div class="mb-4">
                                <label for="projectType" class="form-label">Project Type*</label>
                                <select id="projectType" name="project_type" class="form-select" required>
                                    <option value="">Select a project type</option>
                                    <option value="landing-page">Landing Page</option>
                                    <option value="business-website">Business Website</option>
                                    <option value="portfolio">Portfolio Website</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="pages" class="form-label">Number of Pages*</label>
                                <input type="number" id="pages" name="pages" class="form-control" min="1" step="1" max="5" required>
                            </div>

                            <div class="mb-4">
                                <label for="domain" class="form-label">Domain Requirements*</label>
                                <select id="domain" name="domain" class="form-select" required>
                                    <option value="">Select domain option</option>
                                    <option value="need-domain">Need a new domain</option>
                                    <option value="have-domain">Already have a domain</option>
                                    <option value="not-sure">Not sure yet</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="companyName" class="form-label">Company/Business Name*</label>
                                <input type="text" id="companyName" name="companyName" class="form-control" required>                             
                            </div>

                            <div class="mb-4">
                                <label for="details" class="form-label">Project Details*</label>
                                <textarea id="details" name="details" rows="5" class="form-control" placeholder="Tell us about your project, goals, and any specific requirements..." required></textarea>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                                <label class="form-check-label" for="terms">*I acknowledge that all of the information provided is accurate and correct.</label>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-primary btn-lg px-5">Submit Request</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer py-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start">
                    <p class="mb-0">© <span id="year"></span> Kraken The Kode. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
