    <section class="py-5 mb-0" style="margin-top: 80px;">
        <div class="container text-center">
            <h1 class="mb-3">Request a Quote</h1>
            <p class="lead mb-0">Share your goals, scope, and timeline. I will craft a proposal tailored to your business.</p>
        </div>
    </section>

    <div class="container d-flex justify-content-center">
        <div class="quote-form">
            <form action="/api/submitForm" id="quoteForm" method="POST" enctype="multipart/form-data">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="First&nbsp;Name">First Name</label>
                        <input type="text" name="firstName" id="firstName" class="form-control p-2" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="Last&nbsp;Name">Last Name</label>
                        <input type="text" name="lastName" id="lastName" class="form-control p-2" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" name="emailAddress" id="emailAddress" class="form-control p-2" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label" for="business">Business Name</label>
                        <input type="text" name="businessName" id="businessName" class="form-control p-2" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 mb-3">
                        <label for="Project&nbsp;Type" class="form-label">Project Type</label>
                        <select name="projectType" id="projectType" class="form-select p-2" required>
                            <option value="">Select Project Type</option>
                            <option value="Business Website">Business Website</option>
                            <option value="Personal Website">Personal Website</option>
                            <option value="Portfolio Website">Portfolio Website</option>
                            <option value="Landing Page">Landing Page</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 mb-3">
                        <label for="Domain" class="form-label">Do You Need a Domain?</label>
                        <select name="domain" id="domain" class="form-select p-2" required>
                            <option value="">Select Option</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 mb-3">
                        <label for="Project&nbsp;Description" class="form-label">Project Description</label>
                        <textarea name="projectDescription" id="projectDescription" class="form-control p-2" required></textarea>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label for="PrimaryColor" class="form-label">Primary Color</label>
                        <input type="color" name="primaryColor" id="primaryColor" class="form-control form-control-color p-2" value="#000000" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label for="SecondaryColor" class="form-label">Secondary Color</label>
                        <input type="color" name="secondaryColor" id="secondaryColor" class="form-control form-control-color p-2" value="#000000" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 text-center mb-3">
                        <label for="logoUpload" class="btn btn-primary btn-lg" id="logoUploadLabel">
                            <i class="fas fa-upload me-2"></i>Choose Logo File
                        </label>
                        <input type="file" name="logoUpload" id="logoUpload" class="form-control d-none p-2" accept="image/*" required>
                        <div id="selectedFileName" class="mt-2 text-white"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-primary btn-lg">Submit Quote Request</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- <div class="container d-flex justify-content-center">
        <iframe class="justify-content-center quote-form quote-form-iframe w-100" src="https://docs.google.com/forms/d/e/1FAIpQLSd1jaWrSyXNG47QnHjqpVd-VjoLN9UMx6S2Dv9Z9P5MDhEtfg/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    </div> -->

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
        <div id="quoteToast" class="toast border-0" role="alert" aria-live="assertive" aria-atomic="true" style="min-width: 350px; max-width: 500px;">
            <div class="toast-header">
                <strong class="me-auto">Kraken The Kode</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage" style="white-space: pre-wrap; font-size: 14px; line-height: 1.5;">
                <!-- Toast message will be inserted here -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Logo upload functionality
        document.getElementById('logoUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const label = document.getElementById('logoUploadLabel');
            const fileNameDiv = document.getElementById('selectedFileName');
            
            if (file) {
                // Update the label text to show selected file
                label.innerHTML = '<i class="fas fa-check me-2"></i>File Selected';
                label.classList.remove('btn-primary');
                label.classList.add('btn-success');
                
                // Show the selected filename
                fileNameDiv.innerHTML = `<small>Selected: ${file.name}</small>`;
                fileNameDiv.style.color = '#28a745';
            } else {
                // Reset if no file selected
                label.innerHTML = '<i class="fas fa-upload me-2"></i>Choose Logo File';
                label.classList.remove('btn-success');
                label.classList.add('btn-primary');
                fileNameDiv.innerHTML = '';
            }
        });
        
        // Optional: Add click handler to the label for better UX
        document.getElementById('logoUploadLabel').addEventListener('click', function(e) {
            // The label will automatically trigger the file input due to the 'for' attribute
            // This is just for additional styling feedback
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 150);
        });
    </script>
